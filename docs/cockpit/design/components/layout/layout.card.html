<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:18px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS = Object.values(window).find((v) => v && typeof v === 'object' && v.StatusBadge && v.Button) || {};
const { Panel, Tabs, Toast, CommandPalette, Button } = NS;
function App(){ const [t,setT]=React.useState('journal'); return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,alignItems:'start'}}>
<div style={{display:'grid',gap:14}}><Panel title="Classement" actions={<Button size="sm">Tout voir</Button>}><Tabs tabs={['prompt','code','journal']} value={t} onChange={setT}/><div style={{padding:14,font:'var(--type-meta)',color:'var(--muted-foreground)'}}>contenu · {t}</div></Panel><Toast>Run lancé · 4 projets</Toast></div>
<CommandPalette groups={[{label:'actions',items:[{label:'Lancer un run'},{label:'Thème clair'}]},{label:'modèles',items:[{label:'anthropic/opus-5.5',hint:'Claude Code'},{label:'openai/gpt-5.2-codex',hint:'Codex CLI'}]}]}/>
</div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
