<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:76px}.chip{height:52px;border-radius:6px;border:1px solid rgba(128,128,128,.3)}.n{font:var(--type-label);color:var(--foreground);margin-top:7px}.v{font:var(--type-meta);color:var(--subtle-foreground);margin-top:3px;font-size:11px}</style>
</head><body>
<div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">success</div><div class="v">fg</div></div><div class="sw"><div class="chip" style="background:var(--success-soft)"></div><div class="n">success-soft</div><div class="v">bg</div></div><div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="n">warning</div><div class="v">fg</div></div><div class="sw"><div class="chip" style="background:var(--warning-soft)"></div><div class="n">warning-soft</div><div class="v">bg</div></div><div class="sw"><div class="chip" style="background:var(--destructive)"></div><div class="n">destructive</div><div class="v">fg</div></div><div class="sw"><div class="chip" style="background:var(--destructive-soft)"></div><div class="n">destructive-soft</div><div class="v">bg</div></div><div class="sw"><div class="chip" style="background:var(--active-foreground)"></div><div class="n">active-foreground</div><div class="v">fg</div></div><div class="sw"><div class="chip" style="background:var(--accent)"></div><div class="n">accent</div><div class="v">bg</div></div></div>
</body></html>
