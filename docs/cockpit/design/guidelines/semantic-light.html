<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:76px}.chip{height:52px;border-radius:6px;border:1px solid rgba(128,128,128,.3)}.n{font:var(--type-label);color:var(--foreground);margin-top:7px}.v{font:var(--type-meta);color:var(--subtle-foreground);margin-top:3px;font-size:11px}</style>
</head><body data-theme="light">
<div class="row"><div class="sw"><div class="chip" style="background:var(--background)"></div><div class="n">background</div><div class="v">zinc-50</div></div><div class="sw"><div class="chip" style="background:var(--card)"></div><div class="n">card</div><div class="v">white</div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="n">muted</div><div class="v">zinc-100</div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div class="n">border</div><div class="v">zinc-200</div></div><div class="sw"><div class="chip" style="background:var(--input)"></div><div class="n">input</div><div class="v">zinc-300</div></div><div class="sw"><div class="chip" style="background:var(--foreground)"></div><div class="n">foreground</div><div class="v">zinc-950</div></div><div class="sw"><div class="chip" style="background:var(--muted-foreground)"></div><div class="n">muted-foreground</div><div class="v">zinc-600</div></div><div class="sw"><div class="chip" style="background:var(--ring)"></div><div class="n">ring</div><div class="v">blue-600</div></div></div>
</body></html>
