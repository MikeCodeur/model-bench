<!-- @dsCard group="Spacing" viewport="700x130" subtitle="Small, tight corners — never pills except chips-as-toggles" name="Radius" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:76px}.chip{height:52px;border-radius:6px;border:1px solid rgba(128,128,128,.3)}.n{font:var(--type-label);color:var(--foreground);margin-top:7px}.v{font:var(--type-meta);color:var(--subtle-foreground);margin-top:3px;font-size:11px}</style>
</head><body>
<div class="row" style="gap:16px"><div><div style="width:64px;height:48px;border:1px solid var(--input);background:var(--card);border-radius:var(--radius-xs)"></div><div class="n">xs</div></div><div><div style="width:64px;height:48px;border:1px solid var(--input);background:var(--card);border-radius:var(--radius-sm)"></div><div class="n">sm</div></div><div><div style="width:64px;height:48px;border:1px solid var(--input);background:var(--card);border-radius:var(--radius-md)"></div><div class="n">md</div></div><div><div style="width:64px;height:48px;border:1px solid var(--input);background:var(--card);border-radius:var(--radius-lg)"></div><div class="n">lg</div></div><div><div style="width:64px;height:48px;border:1px solid var(--input);background:var(--card);border-radius:var(--radius-xl)"></div><div class="n">xl</div></div><div><div style="width:64px;height:48px;border:1px solid var(--input);background:var(--card);border-radius:var(--radius-2xl)"></div><div class="n">2xl</div></div></div>
</body></html>
