<!-- @dsCard group="Brand" viewport="700x120" subtitle="Eight states, readable at a glance" name="Result states" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;margin:0}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:76px}.chip{height:52px;border-radius:6px;border:1px solid rgba(128,128,128,.3)}.n{font:var(--type-label);color:var(--foreground);margin-top:7px}.v{font:var(--type-meta);color:var(--subtle-foreground);margin-top:3px;font-size:11px}</style>
</head><body>
<div class="row" style="gap:8px;font:500 11.5px/1 var(--font-mono)">
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;border:1px dashed var(--input);color:var(--subtle-foreground)">○ en attente</span>
<span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:5px;background:var(--accent);color:var(--active-foreground)"><span style="width:7px;height:7px;border-radius:50%;background:var(--ring);animation:mb-pulse var(--pulse)"></span>en cours</span>
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;background:var(--success-soft);color:var(--success)">✓ livré</span>
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;border:1px solid var(--destructive);color:var(--destructive)">▲ ne démarre pas</span>
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;background:var(--destructive-soft);color:var(--destructive)">✕ erreur</span>
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;background:var(--warning-soft);color:var(--warning)">◷ timeout</span>
<span style="display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:5px;background:var(--stopped-soft);color:var(--stopped)">■ arrêté</span>
<span style="display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:5px;border:1px solid var(--input);color:var(--foreground);font-weight:600">v2</span></div>
</body></html>
